name: devp2p Discovery Test

on:
  workflow_dispatch:   # run manually from the Actions tab
  push:
    branches: ["main", "main-gt6j7"]
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC

jobs:
  discover:
    name: Peer Discovery (UDP allowed)
    runs-on: ubuntu-26.04
    # Build took ~19-26 min in the runs measured so far, then the discovery step
    # takes 5 min (at most 5.5 with the KILL grace), then the post-job cache
    # saves. Cold-cache days (post-outage evictions) add ~12 min of Rust compile,
    # and that is exactly when both caches save. The discovery step is bounded
    # by `timeout` below, so this limit is a pure backstop, not the way the run
    # ends: generous costs nothing, and a job cut during the cache save would end
    # "cancelled" again.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version  # exact Temurin release, one place (#734)
      - name: Set up Rust
        # The rustc rust/rust-toolchain.toml pins, like every Rust lane
        # (#734) — not the runner image's preinstalled rustc, which lags on
        # its own schedule, keys the cache to a different compiler, and if it
        # ever fell below the Gradle probe's floor, cargoBuildHost would
        # silently self-skip and this workflow would quietly stop exercising
        # the Rust build.
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust build
        # The :app build compiles the Rust workspace (cargoBuildHost auto-runs
        # before :app:run); without this cache a cold run eats the whole job
        # budget in cargo. Same action/config as the other Rust workflows.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build
        # (--offline was a jitpack-403 workaround for the retired tuweni-kotlin fork;
        # deps now come from Maven Central, so fetch normally.)
        # -PskipRustEngine: no Rust/Android toolchain here, and :android-app builds
        # the engine from source by default; this job only exercises the JVM daemon.
        # cargoBuildHost is named so the Rust host library is built here by
        # construction (not only through a test task -x test leaves in), and the
        # discovery step's 300 s go to the daemon, not to cargo.
        run: ./gradlew build cargoBuildHost -x test --no-daemon -PskipRustEngine

      - name: Run devp2p discovery (5 min timeout)
        id: discovery
        run: |
          # `:app:run` starts the daemon, which runs until stopped: without the
          # `timeout` every run hit the job limit and ended "cancelled" (all of
          # them from 2026-11-20 on, at least). SIGINT lets Gradle and the daemon
          # shut down cleanly; KILL 30 s later if they do not.
          # `timeout` exits 124 when it stopped the command (137 when it took the
          # KILL): that is the planned end, and the next step reads the log.
          # Any other status means Gradle or the daemon ended by itself (a build
          # failure, a daemon that died at start-up): that fails the job, since
          # a quiet network is not the cause. The status is read from PIPESTATUS,
          # so the pipeline itself must not fail the step.
          set +o pipefail
          timeout --signal=INT --kill-after=30s 300 ./gradlew :app:run --no-daemon 2>&1 | tee discovery.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 124 ] && [ "$rc" != 137 ]; then
            echo "::error::./gradlew :app:run ended by itself (status $rc) before the 300 s were over"
            exit 1
          fi

      - name: Report result
        run: |
          echo "--- Summary ---"
          # The daemon's engine decides which line proves devp2p worked: the Rust
          # engine (the default) logs each connected snap peer, the Java engine
          # each answer to a header request. "BLOCK HEADERS RECEIVED", which this
          # step looked for, is no longer logged by either.
          # The 300 s are the step's budget; Gradle's start-up comes out of them,
          # so the daemon itself runs a little less.
          ok='el dial: snap peer connected|\[eth\] Received [0-9]+ block headers'
          if ! grep -q '=== ethp2p Daemon (' discovery.log; then
            echo "The daemon never started (no '=== ethp2p Daemon (' line in discovery.log)."
            tail -30 discovery.log || true
            exit 1
          elif grep -Eq "$ok" discovery.log; then
            echo "SUCCESS: $(grep -Ec "$ok" discovery.log) devp2p connection(s) or header answer(s) within the step's 300 s"
            grep -E "$ok" discovery.log | head -10
          else
            echo "The daemon ran, but no devp2p peer connected and no headers were received within the step's 300 s."
            echo "Discovery / dial lines:"
            grep -E "discv4|el dial|\[eth\]" discovery.log | tail -30 || true
            # Don't fail the job – UDP may still be restricted on this runner
          fi

      - name: Upload discovery log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: discovery-log
          path: discovery.log
          retention-days: 7
