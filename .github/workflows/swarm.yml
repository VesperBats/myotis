# swarm — the embedded ant Swarm node (rust/swarm, crate myotis-swarm), the reader
# of the addr1 address index (.claude/agent/data-sources.md, the Swarm carve-out).
#
# Its own workflow for the same reason as roost.yml: it is deliberately NOT a
# workspace member (rust/Cargo.toml `exclude`), so `cargo test --workspace` and
# rust-clippy.yml do not see it. myotis-engine links it behind its `swarm` feature,
# which a plain cargo build leaves off and Gradle turns on by default (-PswarmEngine:
# cargoBuildHost, cargoNdkAndroid and cargoTest, so ci.yml's `check` tests the workspace
# with it). This lane builds and tests the engine with that feature (addrhist, the
# Swarm reader's only caller) and lints it at rust-clippy.yml's level, checks that the
# feature brings no DNS resolver into the engine's graph, and runs on changes to the
# crates that feature builds.
#
# ant is vendored in rust/vendor/ant (its VENDORED.md): this lane builds it as a
# path dependency, and never fetches it. Cargo decides whether a path crate is
# fresh by file mtime, which a new checkout always moves, so every run builds ant
# again (the git dependency came out of the cache). vendored-ant.yml checks the
# copy against upstream; cargo-locks.yml keeps git sources out of every lock.
#
# Path-filtered, and `push` scoped to main as in the other Rust lanes, so a push
# to a branch with an open PR runs once (under pull_request).
name: swarm

on:
  push:
    branches: ["main"]
    paths:
      - "rust/swarm/**"
      - "rust/vendor/ant/**"
      - "rust/myotis-addr1/**"
      - "rust/myotis-engine/**"
      # The path crates the engine builds with `swarm` on: addrhist, tested only here,
      # calls into myotis-net (addrcheck, ElReader) and myotis-core.
      - "rust/myotis-net/**"
      - "rust/myotis-core/**"
      - "rust/myotis-wire/**"
      - "rust/myotis-consensus/**"
      - "rust/myotis-evm/**"
      - "rust/Cargo.lock"
      - ".github/workflows/swarm.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"
  pull_request:
    paths:
      - "rust/swarm/**"
      - "rust/vendor/ant/**"
      - "rust/myotis-addr1/**"
      - "rust/myotis-engine/**"
      # The path crates the engine builds with `swarm` on: addrhist, tested only here,
      # calls into myotis-net (addrcheck, ElReader) and myotis-core.
      - "rust/myotis-net/**"
      - "rust/myotis-core/**"
      - "rust/myotis-wire/**"
      - "rust/myotis-consensus/**"
      - "rust/myotis-evm/**"
      - "rust/Cargo.lock"
      - ".github/workflows/swarm.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"

jobs:
  test:
    name: myotis-swarm tests and clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: |
            rust/swarm
            rust
      - name: Tests
        run: cargo test --manifest-path rust/swarm/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --locked --manifest-path rust/swarm/Cargo.toml --all-targets -- -D warnings
      # The engine with the reader linked: the only build of addrhist's Swarm half.
      - name: Engine with `swarm` (tests)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p myotis-engine --features swarm --lib addrhist
      - name: Engine with `swarm` (clippy, rust-clippy.yml's level)
        run: cargo clippy --locked --manifest-path rust/Cargo.toml -p myotis-engine --features swarm --all-targets --keep-going -- -D clippy::incompatible_msrv
      # "No DNS" (.claude/agent/data-sources.md): the reader makes no DNS query because
      # ant-p2p's `dnsaddr` feature (rust/vendor/ant-patches/0002) stays off, so neither
      # hickory-resolver 0.25 (for /dnsaddr bootnodes) nor libp2p's DNS transport is built.
      # Only bootnodes are vetted at run time: a /dns4/ underlay from hive gossip is
      # undialable only because the transport is not compiled in. A dependency on ant-node
      # or ant-p2p with default features, anywhere in the graph, would bring both back with
      # every other check green. So, for every version rust/Cargo.lock holds of the three
      # crates: libp2p-dns and hickory 0.25 must have no path from the engine at all, and
      # no hickory may have one through ant (hickory 0.26 is myotis-net's, for EIP-1459 DNS
      # discovery, outside the reader). `cargo tree -i` prints nothing (exit 0) when no path
      # leads to the crate; any failure of it fails the step.
      - name: Engine with `swarm` (no DNS resolver in the reader)
        run: |
          set -euo pipefail
          specs=$(awk '/^name = /{n=$3} /^version = /{v=$3; gsub(/"/,"",n); gsub(/"/,"",v);
                   if (n=="hickory-resolver"||n=="hickory-proto"||n=="libp2p-dns") print n"@"v}' rust/Cargo.lock)
          [ -n "$specs" ] || { echo "::error::no hickory or libp2p-dns in rust/Cargo.lock: check this step"; exit 1; }
          for spec in $specs; do
            found=$(cargo tree --locked --manifest-path rust/Cargo.toml -p myotis-engine --features swarm \
              -e normal,build --target all --prefix none -i "$spec")
            case "$spec" in
              libp2p-dns@*|hickory-*@0.25.*) bad=$found ;;
              *) bad=$(printf '%s\n' "$found" | grep -E '^(ant-[a-z-]+|myotis-swarm) v' || true) ;;
            esac
            if [ -n "$bad" ]; then
              echo "::error::$spec is in myotis-engine's graph with \`swarm\` (ant's \`dnsaddr\` feature back on?):"
              printf '%s\n' "$found"
              exit 1
            fi
            echo "$spec: no path through the Swarm reader"
          done
